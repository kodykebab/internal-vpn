# Desk over the VPN, outside Pilot's own config. Replace the four <values>, install as
# /etc/nginx/conf.d/internal-vpn-desk.conf, then run nginx -t before reloading.
server {
    listen <hub VPN address>:80;
    server_name _;
    client_max_body_size 50m;

    location /assets {
        root <bench path>/sites;
        try_files $uri =404;
    }

    location /files/ {
        root <bench path>/sites/<site>/public;
        try_files $uri @app;
    }

    location / {
        try_files /nonexistent @app;
    }

    location @app {
        proxy_pass http://127.0.0.1:<bench web port>;
        proxy_read_timeout 120;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Frappe-Site-Name <site>;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }
}
